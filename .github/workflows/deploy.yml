name: 部署攻略 Wiki（Astro）

# GitHub Pages 已於 2026-08-19 停用，正式站改由 Cloudflare Workers 服務
# （www.dazotikuy.com）。Cloudflare 專案本身已接了這個 repo 的 GitHub 整合，
# push 到 main 會自動觸發建置，這裡不用再重複 build/deploy 一次。
# 這個檔案現在只剩一件事：每天排程（或手動觸發）戳一下 Cloudflare 的
# Deploy Hook，讓它重新建置一次，藉此帶進最新的 YouTube 影片資料
# （Cloudflare 的建置本身沒有排程機制，只認 git push）。

on:
  schedule:
    - cron: '0 2 * * *'  # 每天台灣時間 10:00
  workflow_dispatch:

jobs:
  ping-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: 觸發 Cloudflare 重新建置
        run: curl -sf -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
