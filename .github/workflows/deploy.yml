name: 部署攻略 Wiki（Astro）

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'  # 每天台灣時間 10:00 自動重建
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署，不取消進行中的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安裝依賴
        run: npm ci

      # 示範影片存放在 Cloudflare R2、不進版控（避免 repo 每月膨脹逾 1GB）。
      # 建置前取回，取回後由 media-manifest.txt 驗證齊全，缺檔就讓建置失敗。
      - name: 安裝 rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      # 快取命中時只需補下載差異檔；清單有變動會退回最近一次快取再補齊。
      - name: 取用影片快取
        uses: actions/cache@v4
        with:
          path: public/type-videos
          key: type-videos-${{ hashFiles('media-manifest.txt') }}
          restore-keys: type-videos-

      - name: 從 R2 取回示範影片
        run: rclone copy r2:botw-totk-wiki-media/type-videos public/type-videos --transfers 8 --stats-one-line --stats 30s
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      # 寧可建置失敗讓維護者收到通知，也不要默默部署一個缺影片的網站。
      - name: 驗證影片素材齊全
        run: npm run media:verify

      # 建置只會抓到「彩現時會當掉」的錯誤，且訊息指向壓縮後的產物。
      # 型別檢查能在原始碼層先擋下元件 props 不符、可能為 undefined 等問題。
      - name: 型別檢查
        run: npm run check

      - name: 抓取 YouTube 熱門影片
        run: node scripts/fetch-youtube.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: 建置 Astro 站台
        run: npm run build

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
