name: 部署攻略 Wiki（Astro）

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'  # 每天台灣時間 10:00 自動重建
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署，不取消進行中的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安裝依賴
        run: npm ci

      # 不需要網路、不用等 R2 下載，最快能失敗的檢查放最前面：
      # 確認 type-content.ts 裡引用的每支影片／圖片都登記在 media-manifest.txt。
      # 擋的是「加了 method.video 卻忘記 npm run media:push」這種清單本身就漏記、
      # 光比對「清單 vs 下載結果」抓不到的漏洞。
      - name: 驗證影片參照完整
        run: npm run media:verify-refs

      # 型別檢查不需要影片實體檔案，也放進網路 I/O 之前，壞掉能更快失敗。
      - name: 型別檢查
        run: npm run check

      # 示範影片存放在 Cloudflare R2、不進版控（避免 repo 每月膨脹逾 1GB）。
      - name: 安裝 rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      # secret 沒設或改名時值會是空字串，rclone 會靜默退回 AWS S3 預設端點，
      # 錯誤訊息只會提到 AWS、完全查不到跟 R2 有關的線索。先在這裡斷言擋掉。
      - name: 檢查 R2 憑證已設定
        run: |
          if [ -z "${{ secrets.R2_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.R2_SECRET_ACCESS_KEY }}" ] || [ -z "${{ secrets.R2_ENDPOINT }}" ]; then
            echo "::error::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT 有未設定的 secret"
            exit 1
          fi

      # 用 sync（非 copy）：R2 是唯一真實來源，本機／CI 端要跟它完全一致。
      # copy 只增不刪，若 R2 被清空或物件被誤刪，copy 會「成功」複製 0 個檔案
      # （exit 0），後面的驗證比對的是「舊快取 + 這次沒抓到東西」，一樣會通過，
      # 等於 R2 壞了也沒人知道。sync 會讓本機也跟著清空，下一步立刻報「缺少
      # 124 個檔案」而失敗——R2 才會是真正意義上的唯一真實來源。
      # CI 是拋棄式環境，sync 的刪除行為在這裡是安全的（不是刪你電腦上的檔案）。
      - name: 從 R2 取回示範影片
        run: rclone sync r2:botw-totk-wiki-media/type-videos public/type-videos --transfers 8 --stats-one-line --stats 30s
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      # 寧可建置失敗讓維護者收到通知，也不要默默部署一個缺影片的網站。
      - name: 驗證影片素材齊全
        run: npm run media:verify

      - name: 抓取 YouTube 熱門影片
        run: node scripts/fetch-youtube.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: 建置 Astro 站台
        run: npm run build

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
